[project]
name = "relatorio-de-confianca-credito"
version = "1.0.0"
description = "Avaliação de um modelo de crédito em quatro camadas (erro, custo, calibração, incerteza), sobre dado sintético"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "scikit-learn>=1.6",
    "markdown>=3.6",
    "matplotlib>=3.9",
]
